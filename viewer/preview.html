<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка питомца</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Проверка питомца</h1>
<p id="preview-status" role="status">Загружаю питомца…</p>
<p>Подведи курсор к питомцу или нажми на голову и хвост. Для охоты оставь курсор неподвижным на 20 секунд.</p>
<section><label for="typing-test">Проверить печать на ноутбуке</label><input type="text" id="typing-test" autocomplete="off" placeholder="Начни печатать здесь"></section>
<section id="animation-tests" hidden><button type="button" data-test="laptop">Открыть, печатать, закрыть</button>
<button type="button" data-test="left">Удержание слева</button>
<button type="button" data-test="right">Удержание справа</button></section>
<p><a href="options.html" target="_blank" rel="noopener">Открыть настройки размера и анимаций</a></p></main>
<script src="profiles.js"></script><script src="behavior.js"></script><script src="watch.js"></script></body></html>
